# Isolated deployment check. No real API keys, messages, host ports or persistent volumes.
services:
  db:
    image: postgres:17
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: radar_test
      POSTGRES_PASSWORD: local_smoke_test_only
      POSTGRES_DB: radar_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_test -d radar_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    build: .
    command: ["ruby", "scripts/test.rb"]
    environment:
      RADAR_TEST_DATABASE_URL: postgresql://radar_test:local_smoke_test_only@db:5432/radar_test
    depends_on:
      db:
        condition: service_healthy
